<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE Headphones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@300;400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050507;
            color: #ffffff;
        }

        .heading-large {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            line-height: 0.9;
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Top Navigation -->
    <nav class="flex justify-between items-center px-12 py-8 absolute top-0 w-full z-20">
        <div class="text-xl font-medium tracking-[0.4em]">P U L S E</div>
        <div class="flex space-x-12 text-[11px] tracking-[0.25em] font-medium text-gray-300">
            <a href="#" class="hover:text-white transition">SOUND</a>
            <a href="#" class="hover:text-white transition">DESIGN</a>
            <a href="#" class="hover:text-white transition">SPECS</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow relative flex items-center overflow-hidden min-h-[90vh] md:min-h-screen">
        
        <!-- Background Image of Headphones -->
        <div class="absolute inset-0 w-full h-full flex justify-end items-center z-0 pointer-events-none overflow-hidden">
            <img src="./local-assets/asset_20408d58dcf34297ec7ae649.png" alt="Pulse Headphones" class="absolute h-[110%] w-auto max-w-none right-[-5%] top-1/2 -translate-y-1/2 object-contain mix-blend-lighten">
        </div>
        
        <!-- Gradient to blend left side (hiding any unwanted artifacts on the left of the image) -->
        <div class="absolute inset-0 bg-gradient-to-r from-[#050507] via-[#050507]/95 to-transparent w-1/2 z-0"></div>

        <!-- Content Container -->
        <div class="relative z-10 px-12 flex flex-col justify-between w-full h-full max-w-7xl mx-auto mt-20">
            <div class="max-w-3xl flex-1 flex flex-col justify-center">
                <h1 class="heading-large text-[90px] md:text-[160px] text-[#F3F2EB] tracking-[-0.03em] md:tracking-[-0.05em] mb-2 md:-ml-2">
                    FEEL EVERY<br>DETAIL.
                </h1>
                <p class="text-xl md:text-2xl text-gray-300 font-light mb-10 tracking-wide">Wireless over-ear headphones.</p>
                
                <div class="flex items-center space-x-6">
                    <button class="bg-[#F3F2EB] text-black px-8 py-4 rounded-full font-medium tracking-[0.15em] text-xs hover:bg-white transition">
                        EXPLORE PULSE
                    </button>
                    <button class="bg-[#2B6DFF] text-white w-12 h-12 rounded-full flex items-center justify-center hover:bg-blue-600 transition shadow-[0_0_20px_rgba(43,109,255,0.4)]">
                        <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Side Text (Right side, lower middle) -->
            <div class="absolute right-12 bottom-32 flex flex-col text-left hidden md:flex z-20">
                <div class="text-[10px] tracking-[0.35em] leading-[2.5] text-gray-400 font-medium mb-4">
                    SOUND<br>SHAPES<br>A BRIGHTER<br>YOU.
                </div>
                <div class="w-8 h-[1px] bg-gray-500"></div>
            </div>
        </div>
    </main>

    <!-- Features Section -->
    <section class="bg-[#F5F4F0] text-black px-12 py-24 flex flex-col xl:flex-row justify-between items-start xl:items-center relative z-20">
        <div class="xl:w-1/3 mb-10 xl:mb-0 pr-8">
            <h2 class="text-[32px] tracking-[0.2em] font-medium text-gray-900 leading-tight">A CLOSER LISTEN.</h2>
        </div>
        
        <div class="xl:w-2/3 flex flex-col md:flex-row w-full space-y-8 md:space-y-0 md:space-x-6">
            <div class="flex-1 flex flex-col">
                <img src="./local-assets/asset_edf63a62904fb43e8d537cec.png" alt="Premium Comfort" class="w-full h-auto aspect-[16/9] object-cover mb-4">
                <span class="text-[9px] tracking-[0.25em] text-gray-500 font-semibold">PREMIUM COMFORT</span>
            </div>
            <div class="flex-1 flex flex-col">
                <img src="./local-assets/asset_0d35fa83e6fc6eaaf2cc95b7.png" alt="Refined Craftsmanship" class="w-full h-auto aspect-[16/9] object-cover mb-4">
                <span class="text-[9px] tracking-[0.25em] text-gray-500 font-semibold">REFINED CRAFTSMANSHIP</span>
            </div>
            <div class="flex-1 flex flex-col">
                <img src="./local-assets/asset_368382f2d8f2375345f40f60.png" alt="Signature Materials" class="w-full h-auto aspect-[16/9] object-cover mb-4">
                <span class="text-[9px] tracking-[0.25em] text-gray-500 font-semibold">SIGNATURE MATERIALS</span>
            </div>
        </div>
    </section>

</body>
</html>
