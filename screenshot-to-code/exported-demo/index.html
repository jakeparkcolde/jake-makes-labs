<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<script src="https://cdn.tailwindcss.com"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@300;400;500&display=swap');
        
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050507;
            color: #ffffff;
            overflow-x: hidden;
        }

        .heading-large {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            line-height: 0.9;
        }

        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans w-full">
<!-- Top Navigation -->
<nav class="flex justify-between items-center px-6 md:px-12 py-8 absolute top-0 w-full z-30">
<div class="text-xl font-medium tracking-[0.4em]">P U L S E</div>
<!-- Desktop Menu -->
<div class="hidden md:flex space-x-12 text-[11px] tracking-[0.25em] font-medium text-gray-300">
<a class="hover:text-white transition" href="#details">SOUND</a>
<a class="hover:text-white transition" href="#details">DESIGN</a>
<a class="hover:text-white transition" href="#details">SPECS</a>
</div>
<!-- Mobile Hamburger Button -->
<button class="md:hidden text-white focus:outline-none z-50" id="menu-btn">
<svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4 6h16M4 12h16M4 18h16" id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Mobile Menu Overlay -->
<div class="fixed inset-0 bg-[#050507] z-40 flex flex-col items-center justify-center space-y-8 opacity-0 pointer-events-none transition-opacity duration-300" id="mobile-menu">
<a class="mobile-link text-lg tracking-[0.25em] font-medium text-white" href="#details">SOUND</a>
<a class="mobile-link text-lg tracking-[0.25em] font-medium text-white" href="#details">DESIGN</a>
<a class="mobile-link text-lg tracking-[0.25em] font-medium text-white" href="#details">SPECS</a>
</div>
</nav>
<!-- Hero Section -->
<main class="flex-grow relative flex flex-col xl:flex-row w-full max-w-[1920px] mx-auto min-h-screen pt-24 xl:pt-0">
<!-- Left Column: Content (44% on xl) -->
<div class="xl:w-[44%] flex flex-col justify-center px-6 sm:px-12 xl:pl-12 2xl:pl-24 z-20 order-1 mt-10 xl:mt-0">
<div class="max-w-3xl w-full">
<h1 class="heading-large text-[65px] sm:text-[90px] md:text-[140px] xl:text-[150px] text-[#F3F2EB] tracking-[-0.03em] md:tracking-[-0.05em] mb-2 md:-ml-2 break-words">
                    FEEL EVERY<br/>DETAIL.
                </h1>
<p class="text-lg md:text-2xl text-gray-300 font-light mb-10 tracking-wide">Wireless over-ear headphones.</p>
<div class="flex items-center space-x-4 sm:space-x-6">
<a class="bg-[#F3F2EB] text-black px-6 sm:px-8 py-3 sm:py-4 rounded-full font-medium tracking-[0.15em] text-[10px] sm:text-xs hover:bg-white transition inline-block" href="#details">
                        EXPLORE PULSE
                    </a>
<a class="bg-[#2B6DFF] text-white w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center hover:bg-blue-600 transition shadow-[0_0_20px_rgba(43,109,255,0.4)] inline-flex flex-shrink-0" href="#details">
<svg class="w-4 h-4 sm:w-5 sm:h-5 ml-1" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</a>
</div>
</div>
</div>
<!-- Right Column: Image (56% on xl) -->
<div class="xl:w-[56%] flex justify-center items-center relative order-2 mt-12 xl:mt-0 w-full h-[45vh] sm:h-[55vh] xl:h-screen">
<!-- Decorative Side Text -->
<div class="absolute right-12 bottom-32 flex-col text-left hidden xl:flex z-20 pointer-events-none">
<div class="text-[10px] tracking-[0.35em] leading-[2.5] text-gray-400 font-medium mb-4">
                    SOUND<br/>SHAPES<br/>A BRIGHTER<br/>YOU.
                </div>
<div class="w-8 h-[1px] bg-gray-500"></div>
</div>
<img alt="Pulse Headphones" class="w-full h-full object-contain xl:object-contain object-center xl:object-right-center px-4 sm:px-12 xl:pr-12 pointer-events-none" src="assets/image-1.png"/>
</div>
</main>
<!-- Features Section -->
<section class="bg-[#F5F4F0] text-black px-6 md:px-12 py-20 flex flex-col xl:flex-row justify-between items-start xl:items-center relative z-20 w-full" id="details">
<div class="xl:w-1/3 mb-10 xl:mb-0 pr-8">
<h2 class="text-[28px] md:text-[32px] tracking-[0.2em] font-medium text-gray-900 leading-tight">A CLOSER LISTEN.</h2>
</div>
<div class="xl:w-2/3 flex flex-col md:flex-row w-full space-y-8 md:space-y-0 md:space-x-6">
<div class="flex-1 flex flex-col">
<div class="w-full aspect-[16/9] mb-4 overflow-hidden bg-black">
<img alt="Premium Comfort" class="w-full h-full object-cover scale-[2.2] object-[30%_60%] origin-center pointer-events-none" src="assets/image-1.png"/>
</div>
<span class="text-[9px] tracking-[0.25em] text-gray-500 font-semibold uppercase">PREMIUM COMFORT</span>
</div>
<div class="flex-1 flex flex-col">
<div class="w-full aspect-[16/9] mb-4 overflow-hidden bg-black">
<img alt="Refined Craftsmanship" class="w-full h-full object-cover scale-[2.2] object-[80%_45%] origin-center pointer-events-none" src="assets/image-1.png"/>
</div>
<span class="text-[9px] tracking-[0.25em] text-gray-500 font-semibold uppercase">REFINED CRAFTSMANSHIP</span>
</div>
<div class="flex-1 flex flex-col">
<div class="w-full aspect-[16/9] mb-4 overflow-hidden bg-black">
<img alt="Signature Materials" class="w-full h-full object-cover scale-[2.2] object-[50%_15%] origin-center pointer-events-none" src="assets/image-1.png"/>
</div>
<span class="text-[9px] tracking-[0.25em] text-gray-500 font-semibold uppercase">SIGNATURE MATERIALS</span>
</div>
</div>
</section>
<!-- Mobile Menu Interactivity Script -->
<script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuIcon = document.getElementById('menu-icon');
        const mobileLinks = document.querySelectorAll('.mobile-link');
        let isMenuOpen = false;

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            if(isMenuOpen) {
                mobileMenu.classList.remove('opacity-0', 'pointer-events-none');
                menuIcon.setAttribute('d', 'M6 18L18 6M6 6l12 12');
                document.body.style.overflow = 'hidden'; // Prevent background scrolling
            } else {
                mobileMenu.classList.add('opacity-0', 'pointer-events-none');
                menuIcon.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
                document.body.style.overflow = '';
            }
        }

        menuBtn.addEventListener('click', toggleMenu);
        mobileLinks.forEach(link => {
            link.addEventListener('click', () => {
                if(isMenuOpen) toggleMenu();
            });
        });
    </script>
</body>
</html>
